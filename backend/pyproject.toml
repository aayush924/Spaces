[project]
name = "myspaces-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pymongo>=4.13",
  "google-genai>=1.30",
  "pydantic-settings>=2.4",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "mongomock>=4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real Gemini API (run with -m live)"]
addopts = "-m 'not live'"

[tool.setuptools]
packages = ["app"]
