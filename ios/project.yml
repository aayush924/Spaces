name: Spaces

options:
  bundleIdPrefix: com.aayushparikh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Spaces:
    type: application
    platform: iOS
    sources:
      - path: Spaces
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aayushparikh.spaces
        PRODUCT_NAME: Spaces
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Spaces/Info.plist
      properties:
        CFBundleDisplayName: Spaces
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Spaces uses the microphone so you can dictate thoughts, list items and todos.
        NSSpeechRecognitionUsageDescription: Spaces transcribes your speech (on-device when supported) into the capture box.
        NSLocalNetworkUsageDescription: Spaces connects to your Spaces server running on your local network during development.
        # DEV ONLY: allows plain-HTTP connections to localhost / your Mac's LAN IP.
        # Remove NSAllowsArbitraryLoads (and ideally this whole dictionary) for production
        # once the backend is served over HTTPS (e.g. Cloud Run).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true

  SpacesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpacesTests
    dependencies:
      - target: Spaces
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aayushparikh.spaces.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Spaces:
    build:
      targets:
        Spaces: all
        SpacesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: SpacesTests
    archive:
      config: Release
